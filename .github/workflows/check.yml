name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scripts/check.py calls `claude plugin validate`, which needs the CLI.
      - run: npm install --global @anthropic-ai/claude-code
      - run: python3 scripts/check.py
