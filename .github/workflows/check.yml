name: check

on:
  pull_request:
  push:
    branches: [main]
  # Lets a run be started by hand: `gh workflow run check --ref main`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scripts/check.py calls `claude plugin validate`, which needs the CLI.
      - run: npm install --global @anthropic-ai/claude-code
      - run: python3 scripts/check.py

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code
      # A pull request installs from its own checkout, so the change under
      # review is what gets tested. Any other run installs from GitHub,
      # exactly as the README tells users to.
      - if: github.event_name == 'pull_request'
        run: scripts/install-test.sh "$GITHUB_WORKSPACE"
      - if: github.event_name != 'pull_request'
        run: scripts/install-test.sh

  # The code shown in each language reference file of both skills, checked against the
  # tested sources in examples/ and then formatted, linted, built and tested.
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [go, typescript, python, java, rust, haskell, lean4, c]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - if: matrix.lang == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: matrix.lang == 'python'
        run: pip install --quiet -r examples/functional-first/python/requirements.txt -r examples/unix-philosophy/python/requirements.txt
      - if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - if: matrix.lang == 'haskell'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14"
      # elan reads the lean-toolchain file in each Lean examples folder and
      # installs that Lean version on the first `lake` call.
      - if: matrix.lang == 'lean4'
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Rust (with rustfmt and clippy) and a C compiler come with the runner.
      - run: scripts/check-examples.py ${{ matrix.lang }}
